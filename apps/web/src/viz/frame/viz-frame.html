<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Visualization frame</title>
    <!-- The sandboxed frame (plan D17). The host posts a view module; main.ts boots frame.ts, which runs it inside #root. -->
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        background: var(--viz-background);
        color: var(--viz-color);
        font-family: var(--viz-font-body);
      }
      #root {
        position: relative;
        width: 100%;
        height: 100%;
        overflow: hidden;
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="./frame.js"></script>
  </body>
</html>
