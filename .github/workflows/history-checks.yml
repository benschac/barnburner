name: History checks

on:
  pull_request:
    paths:
      - '.github/workflows/history-checks.yml'
      - 'scripts/import-nhl-*.py'
      - 'scripts/build-nhl-*.py'
      - 'scripts/check_nhl_*.py'
      - 'scripts/nhl-history-*.py'
      - 'scripts/nhl_*.py'
      - 'scripts/refresh-effect-api.mjs'
      - 'scripts/index-effect-core.mjs'
      - 'scripts/*.mjs'
      - 'lib/**'
      - 'lint/node-scripts.oxlintrc.json'
      - '.agent-sources/effect/**'
      - 'tests/**'
      - 'packages/history/**'
      - 'packages/season/**'
      - 'apps/api/**'
      - 'apps/web/src/season-source.ts'
      - 'apps/web/api/**'
      - 'apps/web/vercel.json'
      - 'apps/web/scripts/check-vercel-output.mjs'
      - 'package.json'
      - 'bun.lock'
      - 'turbo.json'
      - 'data/history/serving.json'
      - 'data/history/manifest.json'
      - 'data/nhl-20262027.json'
      - 'data/nhl-poster-20262027.json'
      - 'data/boxscores/20262027/**'

permissions:
  contents: read

jobs:
  history:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.4.3
      - run: bun install --frozen-lockfile
      - name: Effect API index matches the installed packages
        run: bun run check:effect-api
      - name: Node scripts use the Effect platform services
        run: bun run check:node-scripts
      - name: Python history checks
        run: bun run test:history
      - name: History package checks
        working-directory: packages/history
        run: bun run typecheck && bun run lint && bun run test
      - name: API checks
        working-directory: apps/api
        run: bun run typecheck && bun run lint && bun run test
