name: Validate
on: [push, pull_request]
permissions:
  contents: read
jobs:
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.3
      - run: bun install --frozen-lockfile
      - run: bun run lint
      - run: bun run check:tamagui
      - run: bun run typecheck
      - run: bun run test:data
      - run: bun run --cwd apps/api test
      - run: bun run --cwd apps/web test:teams
      - run: bun run build
