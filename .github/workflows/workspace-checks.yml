name: Workspace checks

on: pull_request

permissions:
  contents: read

jobs:
  workspaces:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.4.3
      - run: bun install --frozen-lockfile
      - name: Check formatting
        run: bun run format:check
      - name: Identify affected workspaces
        id: changes
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          git diff --name-only "$BASE...$HEAD" > "$RUNNER_TEMP/workspace-paths"
          for workspace in analyst web; do
            case "$workspace" in
              analyst) prefix=packages/analyst ;;
              web) prefix=apps/web ;;
            esac
            if grep -Eq "^($prefix/|package\.json$|bun\.lock$|\.github/workflows/workspace-checks\.yml$)" "$RUNNER_TEMP/workspace-paths"; then
              echo "$workspace=true" >> "$GITHUB_OUTPUT"
            fi
          done
      - name: Parse the committed analyst plan
        run: bun run --cwd apps/web test:plan
      - name: Test analyst behavior
        if: steps.changes.outputs.analyst == 'true'
        run: bun run --cwd packages/analyst test
      - name: Check web types and team behavior
        if: steps.changes.outputs.web == 'true'
        run: bun run --cwd apps/web typecheck && bun run --cwd apps/web test:teams
      - name: Build the web app
        if: steps.changes.outputs.web == 'true'
        run: bun run --cwd apps/web build
