name: Refresh NHL history

on:
  workflow_dispatch:
  schedule:
    - cron: "17 7 * * *"
      timezone: America/New_York

concurrency:
  group: nhl-history-refresh
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  refresh:
    if: github.ref_type == 'branch' && github.ref_name == github.event.repository.default_branch && (github.event_name == 'workflow_dispatch' || vars.NHL_HISTORY_REFRESH_ENABLED == 'true')
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.4.3
      - run: bun install --frozen-lockfile
      - name: Fetch the archive release
        run: python3 scripts/nhl-history-archive.py fetch --repo "$GITHUB_REPOSITORY"
      - name: Import the two most recent seasons
        run: python3 scripts/import-nhl-history.py
      - name: Import their box scores
        run: |
          set -euo pipefail
          seasons=$(python3 -c 'import json; ids = sorted(row["id"] for row in json.load(open("data/history/seasons.json"))["data"]); print(*ids[-2:])')
          for season in $seasons; do
            python3 scripts/import-nhl-dressed.py --season "$season"
          done
      - name: Check the archive
        run: python3 scripts/check_nhl_history.py --fetch
      - name: Build the base and serving databases
        run: |
          python3 scripts/build-nhl-history.py --refetch-recent
          bun run data:build:serving
      - name: Accept the serving database
        run: |
          python3 scripts/nhl_history_truth.py --db data/history/nhl.sqlite --out "$RUNNER_TEMP/truth.json" --skip-diameter
          bun run history:accept -- --db "$PWD/data/history/nhl-serve.sqlite" --truth "$RUNNER_TEMP/truth.json" --skip-diameter
      - name: Compare the snapshot ID with the committed pointer
        id: snapshot
        run: |
          set -euo pipefail
          snapshot=$(python3 -c 'import sqlite3; print(sqlite3.connect("data/history/nhl-serve.sqlite").execute("SELECT value FROM meta WHERE key = ?", ("snapshot_id",)).fetchone()[0])')
          current=$(python3 -c 'import json, os; print(json.load(open("data/history/serving.json")).get("snapshotId", "") if os.path.exists("data/history/serving.json") else "")')
          echo "snapshot=$snapshot" >> "$GITHUB_OUTPUT"
          if [ "$snapshot" = "$current" ]; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Snapshot $snapshot is already published; nothing to do."
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Publish the serving file and pointer
        if: steps.snapshot.outputs.changed == 'true'
        env:
          SNAPSHOT: ${{ steps.snapshot.outputs.snapshot }}
        run: |
          set -euo pipefail
          file="nhl-serve-${SNAPSHOT}.sqlite.gz"
          gzip -n -9 -c data/history/nhl-serve.sqlite > "$RUNNER_TEMP/$file"
          gh release upload nhl-history-serving "$RUNNER_TEMP/$file" --clobber
          python3 - "$SNAPSHOT" "$file" <<'PY'
          import hashlib, json, os, sys
          snapshot, file = sys.argv[1:3]
          data = open("data/history/nhl-serve.sqlite", "rb").read()
          pointer = {
              "snapshotId": snapshot,
              "url": f"https://github.com/{os.environ['GITHUB_REPOSITORY']}/releases/download/nhl-history-serving/{file}",
              "sha256": hashlib.sha256(data).hexdigest(),
              "bytes": len(data),
          }
          with open("data/history/serving.json", "w") as out:
              json.dump(pointer, out, indent=2)
              out.write("\n")
          PY
          git add -- data/history/serving.json
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m "chore(history): publish snapshot ${SNAPSHOT}"
          gh auth setup-git --hostname github.com
          git push origin "HEAD:refs/heads/$GITHUB_REF_NAME"
